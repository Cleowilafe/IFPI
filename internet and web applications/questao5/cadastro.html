
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Formulário de Associação</title>
</head>

<body>

    <!-- Cabeçalho -->
    <table border="1" width="100%">
        <tr>
            <td>
                <h2>
                    <span style="color: #287b9e;">△ InstitutoDelta</span>
                    Formulário de Associação
                </h2>
            </td>
        </tr>
    </table>

    <br>

    <!-- Menu de navegação -->
    <table border="1" width="100%">
        <tr>
            <td>
                <a href="index.html">Home</a> |
                <a href="cadastro.html">Cadastro</a> |
                <a href="#" onclick="return false;">Pagamento</a>
            </td>
        </tr>
    </table>

    <br>

    <form action="#" method="get">

        <!-- Dados pessoais -->
        <fieldset>
            <legend>DADOS PESSOAIS</legend>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" size="12">
            (apenas números)

            <label for="nascimento">Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento">

            <br><br>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" size="35">

            <label for="naturalidade">Naturalidade:</label>
            <input type="text" id="naturalidade" name="naturalidade">

            <select name="estado_nascimento">
                <option>PI</option>
                <option>MA</option>
                <option>CE</option>
            </select>

            <br><br>

            <label for="nacionalidade">Nacionalidade:</label>
            <input type="text" id="nacionalidade"
                   name="nacionalidade" value="Brasileira">

            <label for="estado_civil">Estado Civil:</label>
            <select id="estado_civil" name="estado_civil">
                <option>Casado</option>
                <option>Solteiro</option>
                <option>Divorciado</option>
                <option>Viúvo</option>
            </select>

            <br><br>

            <label for="associacao">Tipo associação:</label>
            <select id="associacao" name="associacao">
                <option>Estudante R$ 15,00 por ano</option>
                <option>Profissional</option>
            </select>

            <label for="instituicao">Instituição:</label>
            <input type="text" id="instituicao" name="instituicao">

            <br><br>

            <label for="rg">RG:</label>
            <input type="text" id="rg" name="rg">

            <label for="emissor">Emissor RG:</label>
            <input type="text" id="emissor" name="emissor">

            <label for="profissao">Profissão:</label>
            <input type="text" id="profissao" name="profissao">

        </fieldset>

        <br>

        <!-- Dados para contato -->
        <fieldset>
            <legend>DADOS PARA CONTATO</legend>

            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro" name="logradouro">

            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" size="8">

            <br><br>

            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento" name="complemento">

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro">

            <br><br>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep">
            (apenas números)

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade">

            <select name="estado">
                <option>PI</option>
                <option>MA</option>
                <option>CE</option>
            </select>

            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone">

        </fieldset>

        <br>

        <button type="submit">Confirmar</button>

    </form>

    <br><br>

    <!-- Rodapé -->
    <table border="1" width="100%">
        <tr>
            <td>
                <small>© 2015 Instituto Delta. All rights reserved.</small>
            </td>
        </tr>
    </table>

</body>
</html>
